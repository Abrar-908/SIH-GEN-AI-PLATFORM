services:
  # Backend API
  - type: web
    name: inteltransform-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Frontend Static Site
  - type: web
    name: inteltransform-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sih-gen-ai-platform-2.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
