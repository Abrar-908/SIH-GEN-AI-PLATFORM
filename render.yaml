services:
  - type: web
    name: inteltransform-api
    runtime: python
    rootDir: backend
    buildCommand: /opt/render/project/src/.venv/bin/pip install -r requirements.txt
    startCommand: /opt/render/project/src/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: PYTHON_VERSION
        value: "3.11.9"
